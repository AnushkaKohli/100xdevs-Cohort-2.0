#if enough space is not avaialable in the persistent volume as required by the persistent volume claim then this pod will not start
apiVersion: v1
kind: Pod
metadata:
  name: mongo-pod
spec:
  containers:
    - name: mongo
      image: mongo:4.4
      command: ["mongod", "--bind_ip_all"]
      ports:
        - containerPort: 27017
      volumeMounts:
        # mount /data/db in k8s pod on to the persistent volume using the claim you just created
        - mountPath: "/data/db"
          name: nfs-volume
  volumes:
    - name: nfs-volume
      persistentVolumeClaim:
        claimName: nfs-pvc
