apiVersion: v1
kind: ConfigMap
metadata:
  name: ecom-backend-config
data:
  # These are all non secret data that can be put here. Db URL can be or cannot be a secret
  # property-like keys: each key maps to a single value
  database_url: "mysql://ecom-db:3306/shop"
  cache_size: "1000"
  payment_gateway_url: "https://payment-gateway.example.com"
  max_cart_items: "50"
  session_timeout: "3600"
